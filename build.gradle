import xyz.jpenilla.runpaper.task.RunServer

plugins {
    id 'java'
    id 'idea'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.palantir.git-version' version '5.2.0'
}

def runPaperVersion = '26.3'
// Oldest server the plugin supports, and the Java it runs on there (1.19.4 servers run Java 17)
def oldestMinecraftVersion = '1.19.4'
def targetJavaVersion = 17
// JDK that compiles it: it must read the Paper API, whose class files are Java 25
def compilerJavaVersion = 25
// Version from git, as in ClaimsAndThings: <last tag>[-r<commits since it>.<hash>][+dirty],
// e.g. 7.3.0 on the tagged commit and 7.3.0-r24.a6b5d0c 24 commits after it.
def gitDetails = versionDetails()
// Without a reachable tag (e.g. a shallow clone) git-version reports the commit hash as the tag.
def hasTag = gitDetails.lastTag && !gitDetails.gitHash.startsWith(gitDetails.lastTag)
def lastTag = hasTag ? gitDetails.lastTag.replaceFirst('^v', '') : '0.0.0'
def isClean = providers.exec { commandLine 'git', 'status', '--porcelain' }.standardOutput.asText.get().trim().isEmpty()
def versionSuffix = !hasTag || gitDetails.commitDistance > 0 ? "-r${gitDetails.commitDistance}.${gitDetails.gitHash.take(7)}" : ''
version = "${lastTag}${versionSuffix}${isClean ? '' : '+dirty'}"

idea {
    module {
        // Dev server data, not project sources.
        excludeDirs += files('runs')
    }
}

group = 'me.kryniowesegryderiusz'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    // BentoBox. Its POMs declare themselves as -SNAPSHOT versions, which Gradle rejects; take the jar alone.
    exclusiveContent {
        forRepository {
            maven {
                url = 'https://repo.codemc.io/repository/maven-public/'
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'world.bentobox' }
    }
    // Lands API, DecentHolograms, ItemsAdder API, Slimefun, LitMinions API, CMI API, CMILib
    maven { url = 'https://jitpack.io' }
    // SuperiorSkyblock2 API, WildStacker API
    maven { url = 'https://repo.bg-software.com/repository/api/' }
    // PlaceholderAPI
    maven { url = 'https://repo.extendedclip.com/releases/' }
    // MythicMobs
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    // FactionsUUID
    maven { url = 'https://ci.ender.zone/plugin/repository/everything/' }
    maven { url = 'https://nexus.iridiumdevelopment.net/repository/maven-releases/' }
    maven { url = 'https://repo.nexomc.com/releases' }
    maven { url = 'https://repo.oraxen.com/releases' }
    // PlayerPoints
    maven { url = 'https://repo.rosewooddev.io/repository/public/' }
    maven { url = 'https://repo.fancyinnovations.com/releases' }
    // MMOItems API, MythicLib
    maven { url = 'https://nexus.phoenixdevt.fr/repository/maven-public/' }
    // eco, EcoItems, libreforge
    maven { url = 'https://repo.auxilor.io/repository/maven-public/' }
}

java {
    // foojay downloads this JDK if it is missing.
    toolchain.languageVersion = JavaLanguageVersion.of(compilerJavaVersion)
    // Server and hook APIs are compile-only and newer than Java 17; the server supplies them at runtime.
    disableAutoTargetJvm()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // --release, not just -target: javac then rejects any JDK API newer than Java 17,
    // which would otherwise only fail at runtime on an older server.
    options.release.set(targetJavaVersion)
}

dependencies {
    // Shaded into the plugin jar (relocated in shadowJar below).
    // 13.3.1 could not parse Minecraft 26's version scheme; 13.7.1 and later can.
    implementation 'com.github.cryptomorin:XSeries:14.0.0'
    // Logs through slf4j, which Paper provides
    implementation('com.zaxxer:HikariCP:7.1.0') { exclude group: 'org.slf4j' }
    // Usage statistics; Folia-aware since 3.1
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    // Paper API for the region/entity/global/async schedulers (Folia, also present on Paper)
    compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    compileOnly 'com.intellectualsites.plotsquared:plotsquared-core:7.6.0'
    compileOnly('com.intellectualsites.plotsquared:plotsquared-bukkit:7.6.0') { exclude module: 'plotsquared-core' }

    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'com.bgsoftware:SuperiorSkyblockAPI:2024.1'
    compileOnly 'com.bgsoftware:WildStackerAPI:2026.3'
    compileOnly 'com.github.Slimefun:Slimefun4:RC-37'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'world.bentobox:bentobox:1.23.1'
    // 4.1.5: the only version still published
    compileOnly 'com.iridium:IridiumSkyblock:4.1.5'
    // 2.3.1 bundled an unrelocated old bStats that shadowed bstats-bukkit at compile time
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.10.2'
    compileOnly 'com.github.LoneDev6:api-itemsadder:3.6.1'
    // Non-transitive: EngineHub's metadata pins Guava to an exact old version and pulls in an old
    // Spigot API, which clash with the Paper API. The hooks only need WorldEdit's and WorldGuard's own classes.
    compileOnly('com.sk89q.worldedit:worldedit-core:7.2.20') { transitive = false }
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.2.20') { transitive = false }
    compileOnly('com.sk89q.worldguard:worldguard-core:7.0.8') { transitive = false }
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.8') { transitive = false }
    compileOnly('io.th0rgal:oraxen:1.175.0') {
        exclude group: 'me.gabytm.util', module: 'actions-spigot'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'com.ticxo', module: 'PlayerAnimator'
        exclude group: 'com.github.stefvanschie.inventoryframework', module: 'IF'
        exclude group: 'io.th0rgal', module: 'protectionlib'
        exclude group: 'dev.triumphteam', module: 'triumph-gui'
        exclude group: 'org.bstats', module: 'bstats-bukkit'
        exclude group: 'com.jeff-media', module: 'custom-block-data'
        exclude group: 'com.jeff-media', module: 'persistent-data-serializer'
        exclude group: 'com.jeff_media', module: 'MorePersistentDataTypes'
        exclude group: 'gs.mclo', module: 'java'
    }
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'net.Indyuce:MMOItems-API:6.10.1-SNAPSHOT'
    compileOnly 'io.lumine:MythicLib-dist:1.7.1-SNAPSHOT'  // MMOItems' API extends MythicLib classes
    compileOnly 'com.github.WaterArchery:LitMinionsAPI:3.1.7'
    compileOnly 'com.github.angeschossen:LandsAPI:7.0.2'
    compileOnly 'io.lumine:Mythic-Dist:5.8.0'
    compileOnly 'com.massivecraft:Factions:1.6.9.5-U0.6.40'
    compileOnly('com.nexomc:nexo:1.10.0') { exclude group: 'net.byteflux', module: 'libby-bukkit' }
    compileOnly 'org.black_ixx:playerpoints:3.3.5'
    compileOnly 'de.oliver:FancyHolograms:2.8.0'

    // eco / EcoItems: the oldest published versions. They support Minecraft 1.17-1.19; newer ones
    // dropped those versions (eco 2026.x supports 1.21.8+ only).
    compileOnly 'com.willfp:eco:6.53.0'
    compileOnly 'com.willfp:EcoItems:4.0.0'
    compileOnly 'com.willfp:libreforge:4.0.0'  // what EcoItems 4.0.0 was built with
    // CMI: 9.8.6.4 is the only release JitPack can build
    compileOnly 'com.github.Zrips:CMI-API:9.8.6.4'
    compileOnly 'com.github.Zrips:CMILib:1.6.0.4'  // CMI's API classes reference CMILib types

    // JetsMinions: not published anywhere
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}


def shaded = 'me.kryniowesegryderiusz.kgenerators.dependencies.shaded'
tasks.shadowJar {
    archiveBaseName = 'KGenerators-Regenerated'
    from(file('LICENSE.md'))
    archiveClassifier = ''
    relocate 'com.cryptomorin.xseries', "${shaded}.xseries"
    relocate 'com.zaxxer.hikari', "${shaded}.hikaricp"
    relocate 'org.bstats', "${shaded}.bstats"
}
tasks.jar { enabled = false }
tasks.assemble { dependsOn tasks.shadowJar }

// Every test server gets its own folder under runs/: runs/<version> for Paper, runs/folia-<version> for Folia
tasks.runServer {
    minecraftVersion(runPaperVersion)
    runDirectory = layout.projectDirectory.dir("runs/${runPaperVersion}")
    // Minecraft 26 needs Java 25; the plugin itself is built for Java 17.
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

// Adds a runFolia task, for testing on Folia
runPaper.folia.registerTask()
tasks.named('runFolia') {
    minecraftVersion(runPaperVersion)
    runDirectory = layout.projectDirectory.dir("runs/folia-${runPaperVersion}")
    // Minecraft 26 needs Java 25; the plugin itself is built for Java 17.
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('printReleaseMetadata') {
    doLast {
        println("java_version=${targetJavaVersion}")
        println("oldest_minecraft_version=${oldestMinecraftVersion}")
        println("newest_minecraft_version=${runPaperVersion}")
    }
}

// Older test servers: the floor, the newest Java 17 version, and the newest 1.20 and 1.21: runPaper1_19_4, ...
// Each runs on the Java that version shipped with.
def testServers = ['1.19.4': 17, '1.20.4': 17, '1.20.6': 21, '1.21.11': 21]
testServers.each { mc, jdk ->
    tasks.register("runPaper${mc.replace('.', '_')}", RunServer) {
        group = 'run paper'
        description = "Run a Paper ${mc} server for plugin testing."
        minecraftVersion(mc)
        pluginJars.from(tasks.named("shadowJar").flatMap { it.archiveFile })
        runDirectory = layout.projectDirectory.dir("runs/${mc}")
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(jdk) }
    }
}

// Run test servers headless, as production servers are. Otherwise java.awt.Color (which BungeeCord's
// ChatColor uses for hex colours on 1.16+) tries to load the desktop graphics library, which fails
// without X11 libraries installed.
tasks.withType(RunServer).configureEach {
    jvmArgs('-Djava.awt.headless=true')
}
