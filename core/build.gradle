apply plugin: 'java-library'

dependencies {
    // Shaded into the plugin jar (relocated in the root build.gradle).
    // NBT-API: KGenerators is the only plugin here that needs it, so it is bundled rather than a separate plugin.
    // 2.16.1 is the version verified to load NMS support 'MC26_2'.
    implementation 'de.tr7zw:item-nbt-api:2.16.1'
    // 13.3.1 could not parse Minecraft 26's version scheme; 13.7.1 can.
    // api: core's public methods take and return XMaterial, which the version adapters compile against.
    api 'com.github.cryptomorin:XSeries:13.7.1'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'org.slf4j:slf4j-api:2.0.6'
    implementation 'org.slf4j:slf4j-simple:2.0.6'

    // Paper API for the region/entity/global/async schedulers (Folia, also present on Paper)
    compileOnly 'io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    compileOnly platform('com.intellectualsites.bom:bom-newest:1.47')
    compileOnly 'com.intellectualsites.plotsquared:plotsquared-core'
    compileOnly('com.intellectualsites.plotsquared:plotsquared-bukkit') { exclude module: 'plotsquared-core' }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.bgsoftware:SuperiorSkyblockAPI:2024.1'
    compileOnly 'com.bgsoftware:WildStackerAPI:3.7.0'
    compileOnly 'com.github.Slimefun:Slimefun4:RC-37'
    compileOnly 'com.gmail.filoghost.holographicdisplays:holographicdisplays-api:2.4.0'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'world.bentobox:bentobox:1.16.1'
    compileOnly 'com.iridium:IridiumSkyblock:4.1.5'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.3.1'
    compileOnly 'com.github.LoneDev6:api-itemsadder:3.6.1'
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.2.0-SNAPSHOT'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.2.0-SNAPSHOT'
    compileOnly('com.github.oraxen:oraxen:1.173.0') {
        exclude group: 'me.gabytm.util', module: 'actions-spigot'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'com.ticxo', module: 'PlayerAnimator'
        exclude group: 'com.github.stefvanschie.inventoryframework', module: 'IF'
        exclude group: 'io.th0rgal', module: 'protectionlib'
        exclude group: 'dev.triumphteam', module: 'triumph-gui'
        exclude group: 'org.bstats', module: 'bstats-bukkit'
        exclude group: 'com.jeff-media', module: 'custom-block-data'
        exclude group: 'com.jeff-media', module: 'persistent-data-serializer'
        exclude group: 'com.jeff_media', module: 'MorePersistentDataTypes'
        exclude group: 'gs.mclo', module: 'java'
    }
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'net.Indyuce:MMOItems-API:6.9.2-SNAPSHOT'
    compileOnly 'com.github.WaterArchery:LitMinionsAPI:3.1.7'
    compileOnly 'com.github.angeschossen:LandsAPI:7.0.2'
    compileOnly 'io.lumine:Mythic-Dist:5.6.1'
    compileOnly 'com.massivecraft:Factions:1.6.9.5-U0.6.33'
    compileOnly('com.nexomc:nexo:0.5.0:dev') { exclude group: 'net.byteflux', module: 'libby-bukkit' }
    compileOnly 'org.black_ixx:playerpoints:3.3.0'
    compileOnly 'de.oliver:FancyHolograms:2.4.1'

    // CMI, EcoItems, eco, JetsMinions, Minions-Miner: not published anywhere
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
